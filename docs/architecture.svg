<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="35" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a202c">Enterprise Knowledge Assistant — Architecture</text>

  <!-- Ingestion pipeline (top) -->
  <g font-size="13">
    <rect x="40" y="70" width="170" height="55" rx="8" fill="#e6f0ff" stroke="#3b82f6"/>
    <text x="125" y="93" text-anchor="middle" fill="#1e3a8a" font-weight="bold">Company Documents</text>
    <text x="125" y="111" text-anchor="middle" fill="#1e3a8a" font-size="11">PDF · DOCX · MD · TXT</text>

    <rect x="250" y="70" width="170" height="55" rx="8" fill="#e6f0ff" stroke="#3b82f6"/>
    <text x="335" y="93" text-anchor="middle" fill="#1e3a8a" font-weight="bold">Document Loader</text>
    <text x="335" y="111" text-anchor="middle" fill="#1e3a8a" font-size="11">PyPDF / Docx2txt / MD / Text</text>

    <rect x="460" y="70" width="150" height="55" rx="8" fill="#e6f0ff" stroke="#3b82f6"/>
    <text x="535" y="93" text-anchor="middle" fill="#1e3a8a" font-weight="bold">Chunking</text>
    <text x="535" y="111" text-anchor="middle" fill="#1e3a8a" font-size="11">Recursive Char Splitter</text>

    <rect x="650" y="70" width="150" height="55" rx="8" fill="#e6f0ff" stroke="#3b82f6"/>
    <text x="725" y="93" text-anchor="middle" fill="#1e3a8a" font-weight="bold">Embeddings</text>
    <text x="725" y="111" text-anchor="middle" fill="#1e3a8a" font-size="11">MiniLM (local)</text>

    <rect x="840" y="45" width="150" height="45" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="915" y="72" text-anchor="middle" fill="#14532d" font-weight="bold">FAISS</text>

    <rect x="840" y="105" width="150" height="45" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="915" y="132" text-anchor="middle" fill="#14532d" font-weight="bold">ChromaDB</text>

    <rect x="1020" y="70" width="140" height="55" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="1090" y="93" text-anchor="middle" fill="#78350f" font-weight="bold">BM25 Index</text>
    <text x="1090" y="111" text-anchor="middle" fill="#78350f" font-size="11">Keyword search</text>

    <line x1="210" y1="97" x2="248" y2="97" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="420" y1="97" x2="458" y2="97" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="610" y1="97" x2="648" y2="97" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="800" y1="90" x2="838" y2="68" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="800" y1="105" x2="838" y2="128" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="535" y1="125" x2="1090" y2="70" stroke="#4a5568" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  </g>

  <!-- Query time flow -->
  <g font-size="13">
    <rect x="40" y="220" width="150" height="55" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="115" y="243" text-anchor="middle" fill="#4c1d95" font-weight="bold">User Query</text>
    <text x="115" y="261" text-anchor="middle" fill="#4c1d95" font-size="11">via Streamlit chat</text>

    <rect x="230" y="220" width="190" height="55" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="325" y="243" text-anchor="middle" fill="#4c1d95" font-weight="bold">Conversation Memory</text>
    <text x="325" y="261" text-anchor="middle" fill="#4c1d95" font-size="11">Condense follow-up question</text>

    <line x1="190" y1="247" x2="228" y2="247" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="460" y="180" width="180" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="550" y="210" text-anchor="middle" fill="#0c4a6e" font-weight="bold">Vector / Semantic Search</text>

    <rect x="460" y="245" width="180" height="50" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="550" y="275" text-anchor="middle" fill="#78350f" font-weight="bold">BM25 Keyword Search</text>

    <line x1="420" y1="235" x2="458" y2="205" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="420" y1="255" x2="458" y2="270" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="915" y1="150" x2="560" y2="180" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <line x1="1090" y1="125" x2="560" y2="245" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <rect x="700" y="210" width="190" height="55" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="795" y="233" text-anchor="middle" fill="#0c4a6e" font-weight="bold">Hybrid Fusion</text>
    <text x="795" y="251" text-anchor="middle" fill="#0c4a6e" font-size="11">Reciprocal Rank Fusion</text>

    <line x1="640" y1="205" x2="698" y2="228" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="640" y1="270" x2="698" y2="245" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="940" y="210" width="180" height="55" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="1030" y="233" text-anchor="middle" fill="#7f1d1d" font-weight="bold">Reranking</text>
    <text x="1030" y="251" text-anchor="middle" fill="#7f1d1d" font-size="11">Cross-Encoder</text>

    <line x1="890" y1="237" x2="938" y2="237" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Context -> LLM -->
  <g font-size="13">
    <rect x="720" y="340" width="220" height="55" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="830" y="363" text-anchor="middle" fill="#7f1d1d" font-weight="bold">Relevant Context</text>
    <text x="830" y="381" text-anchor="middle" fill="#7f1d1d" font-size="11">Top-K reranked chunks + sources</text>

    <line x1="1030" y1="265" x2="900" y2="338" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="480" y="400" width="180" height="55" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="570" y="423" text-anchor="middle" fill="#1e3a8a" font-weight="bold">LLM Provider</text>
    <text x="570" y="441" text-anchor="middle" fill="#1e3a8a" font-size="11">System prompt + history + context</text>

    <line x1="720" y1="390" x2="662" y2="415" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="325" y1="275" x2="480" y2="415" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <rect x="280" y="400" width="150" height="45" rx="8" fill="#c7d2fe" stroke="#4338ca"/>
    <text x="355" y="427" text-anchor="middle" fill="#312e81" font-weight="bold">OpenAI GPT</text>

    <rect x="280" y="455" width="150" height="45" rx="8" fill="#c7d2fe" stroke="#4338ca"/>
    <text x="355" y="482" text-anchor="middle" fill="#312e81" font-weight="bold">Google Gemini</text>

    <line x1="480" y1="418" x2="432" y2="422" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="480" y1="440" x2="432" y2="470" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Final answer -->
  <g font-size="13">
    <rect x="480" y="500" width="220" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="590" y="525" text-anchor="middle" fill="#14532d" font-weight="bold">Grounded Answer</text>
    <text x="590" y="543" text-anchor="middle" fill="#14532d" font-size="11">+ Source Citations · Hallucination Guard</text>

    <line x1="570" y1="455" x2="590" y2="498" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="480" y="600" width="220" height="55" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="590" y="623" text-anchor="middle" fill="#4c1d95" font-weight="bold">Streamlit Chat UI</text>
    <text x="590" y="641" text-anchor="middle" fill="#4c1d95" font-size="11">History · Sources · Reset</text>

    <line x1="590" y1="560" x2="590" y2="598" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M480,627 C 250,627 115,450 115,277" stroke="#4a5568" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  </g>

  <text x="600" y="700" text-anchor="middle" font-size="12" fill="#6b7280">
    Dashed lines: data/index availability · Solid lines: runtime data flow
  </text>
</svg>
